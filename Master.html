<style>
/* ==========================================
    Summary Cards Layout & Style
========================================== */
.summary-wrap {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: #0b0f19 !important;
    margin-top: -4px !important; /* 👈 위쪽으로 살짝 끌어올려 흰색 띠를 덮음 */
    position: relative;
    z-index: 2;
}

.summary-card {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .25);
    transition: transform .2s ease;
}

.summary-card:hover {
    transform: translateY(-2px);
}

.summary-title {
    font-size: 13px;
    color: #94a3b8;
}

.summary-value {
    margin-top: 8px;
    font-size: 26px;
    font-weight: bold;
    color: white;
}

/* Status Top Borders */
.summary-order    { border-top: 4px solid #3b82f6; } 
.summary-reject   { border-top: 4px solid #ef4444; } 
.summary-uncheck  { border-top: 4px solid #f59e0b; } 
.summary-ing      { border-top: 4px solid #06b6d4; } 
.summary-done     { border-top: 4px solid #10b981; } 

/* ⚡ 깜빡이는 애니메이션 정의 */
@keyframes blink-red {
    0% { opacity: 1; }
    50% { opacity: 0.2; }
    100% { opacity: 1; }
}

/* ⚡ 깜빡임 효과 클래스 */
.animate-blink {
    animation: blink-red 1s infinite !important; 
}

/* Map Section */
#mapSection {
    height: 40vh;
}
</style>

<div class="summary-wrap">

    <div class="summary-card summary-order">
        <div class="summary-title">📦 오늘오더</div>
        <div id="sumOrder" class="summary-value">0</div>
    </div>

    <div class="summary-card summary-reject">
        <div class="summary-title">❌ 거절됨</div>
        <div id="sumReject" class="summary-value">0</div>
    </div>

    <div class="summary-card summary-uncheck">
        <div class="summary-title">⏳ 미확인</div>
        <div id="sumUncheck" class="summary-value">0</div>
    </div>

    <div class="summary-card summary-ing">
        <div class="summary-title">🚚 배송중</div>
        <div id="sumIng" class="summary-value">0</div>
    </div>

    <div class="summary-card summary-done">
        <div class="summary-title">✅ 배송완료</div>
        <div id="sumDone" class="summary-value">0</div>
    </div>

</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
    console.log("Dashboard Clean Sync Initializing...");

    // 서버의 관제판 데이터 함수를 호출하여 대시보드와 숫자를 동기화
    function loadAndRefreshDashboard() {
        if (typeof google === 'undefined' || !google.script || !google.script.run) return;

        google.script.run
            .withSuccessHandler(function(response) {
                try {
                    // 서버가 던져준 JSON 문자열 또는 배열 데이터를 안전하게 파싱
                    const orders = typeof response === 'string' ? JSON.parse(response) : response;
                    if (!Array.isArray(orders)) return;

                    let total = orders.length;
                    let uncheck = 0;
                    let ing = 0;
                    let done = 0;
                    let reject = 0;

                    // 서버가 이미 가공해 준 orders 배열을 바탕으로 깔끔하게 카운트
                    orders.forEach(order => {
                        const status = String(order.orderStatus || "").trim();

                        if (status === '거절' || status === '거절됨' || status === '취소') {
                            reject++;
                        } else if (status === '배송완료' || status === '완료') {
                            done++;
                        } else if (status === '수락' || status === '배송중' || status === '픽업' || status === '진행중') {
                            ing++;
                        } else {
                            uncheck++; // 미확인 및 그 외
                        }
                    });

                    // 화면 요소에 안전하게 대입 (숫자가 바뀔 때만 갱신하여 깜빡임 방지)
                    updateTextIfChanged('sumOrder', total);
                    updateTextIfChanged('sumUncheck', uncheck);
                    updateTextIfChanged('sumIng', ing);
                    updateTextIfChanged('sumDone', done);

                    const sumRejectEl = document.getElementById('sumReject');
                    if (sumRejectEl) {
                        sumRejectEl.innerText = reject;
                        if (reject > 0) {
                            sumRejectEl.style.color = "#ef4444";
                            sumRejectEl.classList.add('animate-blink');
                        } else {
                            sumRejectEl.style.color = "white";
                            sumRejectEl.classList.remove('animate-blink');
                        }
                    }

                } catch (e) {
                    console.error("대시보드 데이터 파싱 에러:", e);
                }
            })
            .withFailureHandler(function(err) {
                console.error("관제 데이터 통신 실패:", err);
            })
            .getOrderDashboardData(); // 서버에 이미 있는 완벽한 함수 호출!
    }

    // 숫자가 실제로 변할 때만 DOM을 건드리는 보조 함수
    function updateTextIfChanged(elementId, newValue) {
        const el = document.getElementById(elementId);
        if (el && el.innerText != String(newValue)) {
            el.innerText = newValue;
        }
    }

    // 초기 실행 및 기사 동기화 루틴에 연동
    loadAndRefreshDashboard();
    
    // 💡 만약 주기적으로 갱신하고 싶다면 아래 타이머를 쓰되, 
    // 앞서 말씀드린 syncDriversBoard 안에서도 이 loadAndRefreshDashboard()를 같이 호출해 주면 충돌이 없습니다.

    console.log("Dashboard Clean Sync Ready");
});
</script>
