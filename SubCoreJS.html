// 2. 배차 셀렉트박스 및 기사 상태 박스 렌더링
function renderDriverSelectBox(drivers) {
    var selectEl = document.getElementById("assignTypeSelect");
    var statusBox = document.getElementById("driverStatusBox");
    
    if (!drivers || drivers.length === 0) {
        if (statusBox) statusBox.innerText = "근무 중인 기사가 없습니다.";
        return;
    }

    if (statusBox) {
        statusBox.innerText = `현재 근무 중인 기사: ${drivers.length명}명 연동됨`;
    }

    if (selectEl) {
        let html = '<option value="지정배차">-- 지정 기사 선택 --</option>';
        drivers.forEach(function(d) {
            // d.id 와 d.name 구조에 맞춰 매칭
            html += `<option value="${d.id}">${d.name} (${d.id}) - ${d.status || '근무중'}</option>`;
        });
        selectEl.innerHTML = html;
    }
}

// 3. 실시간 오더 관제판 갱신 함수 (필요한 경우 유지)
